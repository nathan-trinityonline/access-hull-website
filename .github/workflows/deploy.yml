# Builds the site and uploads it to SiteGround whenever main changes,
# including every time someone publishes in the content editor (/admin/).
#
# Secrets to add in GitHub (Settings > Secrets and variables > Actions > New repository secret):
#   SG_SSH_KEY                  the private key from SiteGround Site Tools > Devs > SSH Keys Manager
#   SG_SSH_PASSPHRASE           that key's password
#   DECAP_GITHUB_CLIENT_SECRET  the client secret of the GitHub OAuth app used to sign in to /admin/
# The upload step is skipped until SG_SSH_KEY exists.
name: Build and deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: https://accesshull.co.uk
  SG_HOST: gukm1084.siteground.biz
  SG_PORT: "18765"
  SG_USER: u692-zbe2qof7apqy
  SG_PATH: www/accesshull.co.uk/public_html
  # Form emails: sender, and who receives each form
  MAIL_FROM: website@accesshull.co.uk
  MAIL_TO_CONTACT: info@accesshull.co.uk
  MAIL_TO_PARTNER: partners@accesshull.co.uk
  MAIL_TO_DONATE: donate@accesshull.co.uk
  # Survey help requests always email this address; set the next line to "false" to skip an email for every other response
  MAIL_TO_SURVEY: info@accesshull.co.uk
  SURVEY_ALERT_EVERY_RESPONSE: "true"
  # Client ID of the GitHub OAuth app for /admin/ sign-in (not secret)
  DECAP_GITHUB_CLIENT_ID: ${{ vars.DECAP_GITHUB_CLIENT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      HAS_SSH_KEY: ${{ secrets.SG_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Write server settings (api/config.php)
        env:
          DECAP_GITHUB_CLIENT_SECRET: ${{ secrets.DECAP_GITHUB_CLIENT_SECRET }}
        run: |
          php -r '
            $c = [
              "from" => getenv("MAIL_FROM"),
              "from_name" => "Access:Hull website",
              "forms" => [
                "contact" => ["to" => [getenv("MAIL_TO_CONTACT")], "subject" => "New message from the contact form"],
                "partner" => ["to" => [getenv("MAIL_TO_PARTNER")], "subject" => "New partner questionnaire"],
                "donate-a-device" => ["to" => [getenv("MAIL_TO_DONATE")], "subject" => "New device donation offer"],
              ],
              "survey_alerts" => ["to" => [getenv("MAIL_TO_SURVEY")], "every_response" => getenv("SURVEY_ALERT_EVERY_RESPONSE") === "true"],
              "github_repo" => getenv("GITHUB_REPOSITORY"),
              "github_client_id" => (string)getenv("DECAP_GITHUB_CLIENT_ID"),
              "github_client_secret" => (string)getenv("DECAP_GITHUB_CLIENT_SECRET"),
            ];
            echo "<?php\n// Written by the deploy workflow. Edit .github/workflows/deploy.yml instead.\nreturn " . var_export($c, true) . ";\n";
          ' > dist/api/config.php
          php -l dist/api/config.php

      - name: Upload to SiteGround
        if: env.HAS_SSH_KEY == 'true'
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" | python3 scripts/fix-ssh-key.py > ~/.ssh/siteground
          chmod 600 ~/.ssh/siteground
          if ! ssh-keygen -y -P "$SG_SSH_PASSPHRASE" -f ~/.ssh/siteground > /dev/null; then
            echo "::error::The SG_SSH_KEY secret could not be opened with the SG_SSH_PASSPHRASE secret. Re-copy the private key from SiteGround and check the password."
            exit 1
          fi
          ssh-keyscan -p "$SG_PORT" "$SG_HOST" >> ~/.ssh/known_hosts
          # Unlock the key with its password, if it has one
          eval "$(ssh-agent -s)"
          printf '#!/bin/sh\necho "$SG_SSH_PASSPHRASE"\n' > ~/.ssh/askpass && chmod 700 ~/.ssh/askpass
          SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=none ssh-add ~/.ssh/siteground < /dev/null
          # --delete removes files the site no longer has, but never SiteGround's .well-known folder
          rsync -az --delete --exclude '.well-known/' \
            -e "ssh -p $SG_PORT" \
            dist/ "$SG_USER@$SG_HOST:$SG_PATH/"
